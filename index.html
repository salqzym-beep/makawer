<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d2747"><title>محل بيع مخاوير امارتية</title><style>
:root{--m:#6d2747;--bg:#fbf7f3}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#30242a}header{background:linear-gradient(135deg,#542039,#8e4565);color:white;text-align:center;padding:34px 15px}.shop-name{font-size:clamp(23px,5vw,34px);font-weight:bold;cursor:pointer}header p{font-size:14px;color:#f4e8ed}main{max-width:1100px;margin:25px auto;padding:0 15px}.section-title{text-align:center;color:var(--m)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.product{background:white;border-radius:15px;overflow:hidden;border:1px solid #efe5e8}.gallery{position:relative;background:#f1e8eb}.gallery img,.no-image{width:100%;height:250px;object-fit:cover;display:grid;place-items:center}.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:8px;pointer-events:none}.gallery-nav button{pointer-events:auto;border:0;border-radius:50%;width:36px;height:36px;background:#fffd;color:var(--m);font-size:23px}.count{position:absolute;bottom:8px;left:8px;background:#0009;color:white;padding:4px 9px;border-radius:20px;font-size:11px}.details{padding:13px}.details h3{margin:0 0 9px}.price{font-weight:bold;color:var(--m)}.empty{text-align:center;padding:50px 12px;background:white;border-radius:14px;color:#8c7b82}footer{text-align:center;padding:25px;color:#927d86;font-size:12px}
</style></head><body><header><div class="shop-name" id="shopName">محل بيع مخاوير امارتية</div><p>أناقة إماراتية بتفاصيل مميزة</p></header><main><h2 class="section-title">منتجات المحل</h2><div id="products" class="products"></div></main><footer>محل بيع مخاوير امارتية</footer><script>
const root=document.getElementById('products');let taps=0,timer;document.getElementById('shopName').onclick=()=>{if(++taps>=5)location.href='admin.html';clearTimeout(timer);timer=setTimeout(()=>taps=0,1800)};
function imgs(p){return Array.isArray(p.images)&&p.images.length?p.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):(p.image?[p.image]:[])}
function render(data){root.innerHTML='';if(!data.products.length){root.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد منتجات حالياً</div>';return}data.products.forEach(p=>{let card=document.createElement('article');card.className='product';let images=imgs(p);if(images.length){let g=document.createElement('div');g.className='gallery';let im=document.createElement('img');im.src=images[0];im.alt=p.name;im.loading='lazy';g.append(im);if(images.length>1){let n=0,nav=document.createElement('div');nav.className='gallery-nav';let a=document.createElement('button'),b=document.createElement('button'),c=document.createElement('span');a.textContent='‹';b.textContent='›';c.className='count';c.textContent='1 / '+images.length;function show(v){n=(v+images.length)%images.length;im.src=images[n];c.textContent=(n+1)+' / '+images.length}a.onclick=()=>show(n-1);b.onclick=()=>show(n+1);nav.append(a,b);g.append(nav,c)}card.append(g)}else{let no=document.createElement('div');no.className='no-image';no.textContent='بدون صورة';card.append(no)}let d=document.createElement('div');d.className='details';let h=document.createElement('h3');h.textContent=p.name;d.append(h);if(p.price){let pr=document.createElement('div');pr.className='price';pr.textContent=p.price;d.append(pr)}card.append(d);root.append(card)})}
(async()=>{try{let r=await fetch('/api/store',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();let n=d.shopName||'محل بيع مخاوير امارتية';document.getElementById('shopName').textContent=n;document.title=n;document.querySelector('footer').textContent=n;render(d)}catch(e){root.innerHTML='<div class="empty" style="grid-column:1/-1">تعذر تحميل المنتجات. تحقق من إعداد Vercel Blob.</div>'}})();
</script></body></html>
