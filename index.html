<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d2747"><title>محل بيع مخاوير امارتية</title><style>
:root{--m:#6d2747;--bg:#fbf7f3}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#30242a}header{background:linear-gradient(135deg,#542039,#8e4565);color:white;text-align:center;padding:34px 15px}.shop-name{font-size:clamp(23px,5vw,34px);font-weight:bold;cursor:pointer}header p{font-size:14px;color:#f4e8ed}main{max-width:1100px;margin:25px auto;padding:0 15px}.section-title{text-align:center;color:var(--m)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.product{background:white;border-radius:15px;overflow:hidden;border:1px solid #efe5e8}.gallery{position:relative;background:#f1e8eb}.gallery img,.no-image{width:100%;height:250px;object-fit:cover;display:grid;place-items:center}.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:8px;pointer-events:none}.gallery-nav button{pointer-events:auto;border:0;border-radius:50%;width:36px;height:36px;background:#fffd;color:var(--m);font-size:23px}.count{position:absolute;bottom:8px;left:8px;background:#0009;color:white;padding:4px 9px;border-radius:20px;font-size:11px}.details{padding:13px}.details h3{margin:0 0 9px}.price{font-weight:bold;color:var(--m)}.empty{text-align:center;padding:50px 12px;background:white;border-radius:14px;color:#8c7b82}footer{text-align:center;padding:25px;color:#927d86;font-size:12px}.info-panel{background:#fff;border:1px solid #efe5e8;border-radius:15px;padding:18px;margin:20px 0}.info-panel h3{color:var(--m);margin:0 0 12px}.bank-line{padding:7px 0;border-bottom:1px solid #f1e9ec}.bank-line:last-child{border:0}.wa-link{display:inline-block;margin-top:12px;background:#168b55;color:white;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:bold}
</style></head><body><header><div class="shop-name" id="shopName">محل بيع مخاوير امارتية</div><p>أناقة إماراتية بتفاصيل مميزة</p></header><main><h2 class="section-title">منتجات المحل</h2><div id="products" class="products"></div><section class="info-panel" id="bankPanel" hidden><h3>بيانات التحويل البنكي</h3><div class="bank-line">اسم صاحب الحساب: <b id="accountOwner"></b></div><div class="bank-line">اسم البنك: <b id="bankName"></b></div><div class="bank-line">رقم الحساب: <b id="accountNumber"></b></div></section><section class="info-panel" id="contactPanel" hidden><h3>تواصل معنا عبر واتساب</h3><p>يسعدنا استقبال استفساراتكم وطلباتكم</p><a class="wa-link" id="whatsappLink" target="_blank" rel="noopener">تواصل عبر واتساب</a></section></main><footer>محل بيع مخاوير امارتية</footer><script>
const root=document.getElementById('products');const $=id=>document.getElementById(id);let taps=0,timer;document.getElementById('shopName').onclick=()=>{if(++taps>=5)location.href='admin.html';clearTimeout(timer);timer=setTimeout(()=>taps=0,1800)};
function imgs(p){return Array.isArray(p.images)&&p.images.length?p.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):(p.image?[p.image]:[])}
function render(data){root.innerHTML='';if(!data.products.length){root.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد منتجات حالياً</div>';return}data.products.forEach(p=>{let card=document.createElement('article');card.className='product';let images=imgs(p);if(images.length){let g=document.createElement('div');g.className='gallery';let im=document.createElement('img');im.src=images[0];im.alt=p.name;im.loading='lazy';g.append(im);if(images.length>1){let n=0,nav=document.createElement('div');nav.className='gallery-nav';let a=document.createElement('button'),b=document.createElement('button'),c=document.createElement('span');a.textContent='‹';b.textContent='›';c.className='count';c.textContent='1 / '+images.length;function show(v){n=(v+images.length)%images.length;im.src=images[n];c.textContent=(n+1)+' / '+images.length}a.onclick=()=>show(n-1);b.onclick=()=>show(n+1);nav.append(a,b);g.append(nav,c)}card.append(g)}else{let no=document.createElement('div');no.className='no-image';no.textContent='بدون صورة';card.append(no)}let d=document.createElement('div');d.className='details';let h=document.createElement('h3');h.textContent=p.name;d.append(h);if(p.price){let pr=document.createElement('div');pr.className='price';pr.textContent=p.price;d.append(pr)}card.append(d);root.append(card)})}
(async()=>{try{let r=await fetch('/api/store',{cache:'no-store'});if(!r.ok)throw Error();let d=await r.json();let n=d.shopName||'محل بيع مخاوير امارتية';document.getElementById('shopName').textContent=n;document.title=n;document.querySelector('footer').textContent=n;render(d);const s=d.settings||{};if(s.accountOwner||s.bankName||s.accountNumber){$('bankPanel').hidden=false;$('accountOwner').textContent=s.accountOwner||'—';$('bankName').textContent=s.bankName||'—';$('accountNumber').textContent=s.accountNumber||'—'}if(s.whatsapp){let num=String(s.whatsapp).replace(/\\D/g,'');if(num.startsWith('0'))num='967'+num.slice(1);else if(num.length===9)num='967'+num;$('contactPanel').hidden=false;$('whatsappLink').href='https://wa.me/'+num+'?text='+encodeURIComponent('مرحباً، وصلت إليكم من موقع المتجر وأرغب بالاستفسار.');$('whatsappLink').textContent='تواصل عبر واتساب '+s.whatsapp}}catch(e){root.innerHTML='<div class="empty" style="grid-column:1/-1">تعذر تحميل المنتجات. تحقق من إعداد Vercel Blob.</div>'}})();
</script></body></html>
