<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#fbf7f3;color:#30242a}header{background:linear-gradient(135deg,#542039,#8e4565);color:white;text-align:center;padding:22px}main{max-width:680px;margin:22px auto;padding:0 14px}.panel{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px #44202a12}h2{color:#6d2747;font-size:20px;margin:0 0 15px}label{display:block;font-weight:bold;margin:13px 0 7px;font-size:14px}input{width:100%;padding:12px;border:1px solid #dfd1d7;border-radius:10px;font:inherit}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:10px;background:#6d2747;color:white;padding:13px;margin-top:16px;font-weight:bold}.secondary{border:0;border-radius:10px;background:#f4e9ed;color:#6d2747;padding:11px}.row{display:flex;align-items:center;gap:10px;border-top:1px solid #eee;padding:10px 0}.row img{width:55px;height:62px;object-fit:cover;border-radius:8px}.info{flex:1}.delete{border:0;background:#fae9e9;color:#a22;border-radius:8px;padding:8px}.hint{font-size:12px;color:#897780;line-height:1.7}#workspace{display:none}#preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}#preview img{width:100%;height:70px;object-fit:cover;border-radius:7px}.status{font-size:13px;margin-top:8px}
</style></head><body><header><h2 style="color:white;margin:0">لوحة التحكم</h2><div>محل بيع مخاوير امارتية</div></header><main>
<section class="panel" id="login"><h2>دخول لوحة التحكم</h2><form id="loginForm"><label>الرمز السري</label><input id="password" type="password" required><button class="primary">دخول</button><div id="error" class="status" style="color:#b42318;white-space:pre-wrap"></div></form></section>
<section id="workspace"><div id="loadError" class="status" style="color:#b42318;white-space:pre-wrap;margin:10px 0"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">إدارة المنتجات</h2><button class="secondary" onclick="location.href='index.html'">العودة للمحل</button></div>
<div class="panel"><h2>تغيير اسم المحل</h2><form id="nameForm"><label>اسم المحل الجديد</label><input id="shopName" maxlength="100" required><button class="primary">حفظ اسم المحل</button></form></div>
<div class="panel"><h2>بيانات الحساب البنكي والتواصل</h2><form id="settingsForm"><label>اسم صاحب الحساب</label><input id="accountOwner" maxlength="100" placeholder="اسم صاحب الحساب"><label>اسم البنك</label><input id="bankName" maxlength="100" placeholder="اسم البنك"><label>رقم الحساب</label><input id="accountNumber" maxlength="100" placeholder="رقم الحساب"><label>رقم واتساب</label><input id="whatsapp" inputmode="tel" maxlength="20" placeholder="737871631"><p class="hint">تظهر البيانات في الصفحة الرئيسية. يمكن ترك أي حقل فارغاً لإخفائه.</p><button class="primary">حفظ بيانات الحساب والتواصل</button></form></div>
<div class="panel"><h2>إضافة منتج جديد</h2><form id="productForm"><label>اسم المنتج</label><input id="productName" maxlength="100" required><label>السعر (اختياري)</label><input id="productPrice" placeholder="مثال: 15000 ريال"><label>صور المنتج (اختياري - حتى 10 صور)</label><input id="productImages" type="file" accept="image/*" multiple><p class="hint">يمكن إضافة المنتج بدون صور. سيتم ضغط الصور تلقائياً.</p><div id="preview"></div><div id="status" class="status"></div><button class="primary" id="add">إضافة المنتج</button></form></div>
<div class="panel"><h2>المنتجات المضافة</h2><div id="items"></div></div></section></main>
<script>
let pass='',products=[];const $=id=>document.getElementById(id);
async function api(action,extra={}){let r=await fetch('/api/store',{method:action==='get'?'GET':'POST',headers:{'Content-Type':'application/json'},body:action==='get'?undefined:JSON.stringify({action,password:pass,...extra})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function pics(p){return Array.isArray(p.images)&&p.images.length?p.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):(p.image?[p.image]:[])}
async function load(){let d=await api('get');products=d.products||[];$('shopName').value=d.shopName||'محل بيع مخاوير امارتية';let s=d.settings||{};$('accountOwner').value=s.accountOwner||'';$('bankName').value=s.bankName||'';$('accountNumber').value=s.accountNumber||'';$('whatsapp').value=s.whatsapp||'737871631';draw();$('loadError').textContent=''}
function draw(){$('items').innerHTML='';if(!products.length){$('items').textContent='لا توجد منتجات';return}products.forEach(p=>{let row=document.createElement('div');row.className='row';let a=pics(p);if(a[0]){let im=document.createElement('img');im.src=a[0];row.append(im)}let info=document.createElement('div');info.className='info';let b=document.createElement('b');b.textContent=p.name;let s=document.createElement('div');s.className='hint';s.textContent=(p.price||'بدون سعر')+' · '+a.length+' صور';info.append(b,s);let del=document.createElement('button');del.className='delete';del.textContent='حذف';del.onclick=async()=>{if(confirm('حذف المنتج؟')){try{await api('deleteProduct',{id:p.id});await load()}catch(e){alert(e.message)}}};row.append(info,del);$('items').append(row)})}
function compress(f){return new Promise((ok,no)=>{if(!f.type.startsWith('image/'))return no(Error('اختر ملفات صور فقط'));let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let scale=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.76))};im.src=r.result};r.readAsDataURL(f)})}
$('productImages').onchange=()=>{let fs=[...$('productImages').files];$('preview').innerHTML='';if(fs.length>10){alert('الحد الأقصى 10 صور');$('productImages').value='';return}fs.forEach(f=>{let im=document.createElement('img');im.src=URL.createObjectURL(f);$('preview').append(im)})};
$('loginForm').onsubmit=async e=>{e.preventDefault();pass=$('password').value.trim();$('error').textContent='جارٍ التحقق...';try{await api('login');$('login').style.display='none';$('workspace').style.display='block';$('error').textContent='';try{await load()}catch(x){$('loadError').textContent='تم قبول كلمة المرور، لكن تعذر تحميل بيانات المتجر: '+x.message+' — تحقق من إعداد Vercel Blob.'}}catch(x){$('error').textContent='تعذر تسجيل الدخول: '+x.message+' (لم يتم مسح كلمة المرور)'}};
$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('saveSettings',{settings:{accountOwner:$('accountOwner').value.trim(),bankName:$('bankName').value.trim(),accountNumber:$('accountNumber').value.trim(),whatsapp:$('whatsapp').value.trim()}});alert('تم حفظ بيانات الحساب والتواصل')}catch(x){alert(x.message)}};
$('nameForm').onsubmit=async e=>{e.preventDefault();try{await api('rename',{shopName:$('shopName').value.trim()});alert('تم حفظ اسم المحل')}catch(x){alert(x.message)}};
$('productForm').onsubmit=async e=>{e.preventDefault();let fs=[...$('productImages').files];if(fs.length>10)return alert('الحد الأقصى 10 صور');$('add').disabled=true;try{let images=[];for(let i=0;i<fs.length;i++){$('status').textContent='ضغط الصورة '+(i+1)+' من '+fs.length;images.push(await compress(fs[i]))}$('status').textContent='جارٍ الحفظ';await api('addProduct',{name:$('productName').value.trim(),price:$('productPrice').value.trim(),images});e.target.reset();$('preview').innerHTML='';$('status').textContent='تمت الإضافة';await load()}catch(x){alert(x.message);$('status').textContent=''}finally{$('add').disabled=false}};
</script></body></html>
