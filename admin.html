<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم المتجر</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma;background:#fbf7f3;color:#30242a}header{background:linear-gradient(135deg,#542039,#8e4565);color:white;text-align:center;padding:22px}main{max-width:850px;margin:22px auto;padding:0 14px}.panel{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #44202a12}h2{color:#6d2747;font-size:19px;margin:0 0 14px}label{display:block;font-weight:bold;margin:12px 0 6px;font-size:14px}input,textarea{width:100%;padding:11px;border:1px solid #dfd1d7;border-radius:9px;font:inherit}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:9px;background:#6d2747;color:white;padding:11px 14px;font-weight:bold}.secondary{border:0;border-radius:9px;background:#f4e9ed;color:#6d2747;padding:10px}.danger{border:0;border-radius:9px;background:#fae9e9;color:#a22;padding:9px}.row{display:flex;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0;flex-wrap:wrap}.row img{width:58px;height:65px;object-fit:cover;border-radius:8px}.info{flex:1;min-width:140px}.hint{font-size:12px;color:#897780;line-height:1.7}.status{font-size:13px;margin-top:8px;white-space:pre-wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{flex:1;min-width:120px}.hidden{display:none!important}#preview,.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#preview img,.thumbs img{width:58px;height:68px;object-fit:cover;border-radius:7px} .order{border:1px solid #eee;border-radius:12px;padding:13px;margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.badge{background:#f4e9ed;color:#6d2747;padding:5px 9px;border-radius:20px;font-size:12px}.order img.receipt{width:100%;max-width:220px;max-height:220px;object-fit:contain;display:block;margin:8px 0;border:1px solid #eee}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style></head><body><header><h2 style="color:white;margin:0">لوحة التحكم</h2><div>إدارة المتجر والطلبات</div></header><main>
<section class="panel" id="login"><h2>دخول لوحة التحكم</h2><form id="loginForm"><label>الرمز السري</label><input id="password" type="password" required><button class="primary" style="width:100%;margin-top:14px">دخول</button><div id="error" class="status" style="color:#b42318"></div></form></section>
<section id="workspace" class="hidden">
<div class="tabs"><button class="primary" id="tabProducts">المنتجات</button><button class="secondary" id="tabOrders">الطلبات <span id="orderCount"></span></button><button class="secondary" onclick="location.href='index.html'">عرض المتجر</button></div>
<section id="productsView">
<div class="panel"><h2>اسم المحل</h2><form id="nameForm"><input id="shopName" maxlength="100" required><button class="primary" style="width:100%;margin-top:12px">حفظ اسم المحل</button></form></div>
<div class="panel"><h2>تغيير ألوان المتجر</h2><p class="hint">اختر الألوان، وستظهر في الصفحة الرئيسية بعد الحفظ.</p><form id="themeForm"><div class="grid2"><div><label>اللون الأساسي</label><input type="color" id="themePrimary" value="#6d2747"></div><div><label>خلفية الصفحة</label><input type="color" id="themeBackground" value="#fbf7f3"></div><div><label>بداية لون رأس الصفحة</label><input type="color" id="themeHeaderStart" value="#542039"></div><div><label>نهاية لون رأس الصفحة</label><input type="color" id="themeHeaderEnd" value="#8e4565"></div><div><label>خلفية البطاقات</label><input type="color" id="themeCard" value="#ffffff"></div><div><label>لون النصوص</label><input type="color" id="themeText" value="#30242a"></div></div><button class="primary" style="width:100%;margin-top:12px">حفظ ألوان المتجر</button></form></div><div class="panel"><h2>بيانات الحساب البنكي والتواصل</h2><form id="settingsForm"><label>اسم صاحب الحساب</label><input id="accountOwner" maxlength="100"><label>اسم البنك</label><input id="bankName" maxlength="100"><label>رقم الحساب</label><input id="accountNumber" maxlength="100"><label>رقم واتساب</label><input id="whatsapp" inputmode="tel" maxlength="20" placeholder="737871631"><button class="primary" style="width:100%;margin-top:12px">حفظ البيانات</button></form></div>
<div class="panel"><h2 id="productFormTitle">إضافة منتج</h2><form id="productForm"><input id="editId" type="hidden"><label>اسم المنتج</label><input id="productName" maxlength="100" required><label>السعر مع العملة</label><input id="productPrice" placeholder="مثال: 15000 ريال" required><label>صور المنتج (حتى 10 صور)</label><input id="productImages" type="file" accept="image/*" multiple><p class="hint" id="imageHint">عند التعديل وترك الصور فارغة ستبقى الصور الحالية كما هي. اختيار صور جديدة يستبدلها.</p><div id="preview"></div><button class="primary" id="saveProduct" style="width:100%;margin-top:14px">حفظ المنتج</button><button type="button" class="secondary hidden" id="cancelEdit" style="width:100%;margin-top:8px">إلغاء التعديل</button><div id="productStatus" class="status"></div></form></div>
<div class="panel"><h2>المنتجات المضافة</h2><div id="items"></div></div></section>
<section id="ordersView" class="hidden"><div class="panel"><h2>قائمة الطلبات</h2><div id="orders"></div></div></section>
</section></main><script>
let pass='',products=[],orders=[];const $=id=>document.getElementById(id);
async function api(action,extra={}){let r=await fetch('/api/store',{method:action==='get'?'GET':'POST',headers:{'Content-Type':'application/json'},body:action==='get'?undefined:JSON.stringify({action,password:pass,...extra})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function pics(p){return Array.isArray(p.images)&&p.images.length?p.images.map(x=>typeof x==='string'?x:x.url).filter(Boolean):(p.image?[p.image]:[])}
async function load(){let d=await api('get');products=d.products||[];orders=d.orders||[];$('shopName').value=d.shopName||'محل بيع مخاوير امارتية';let s=d.settings||{};$('accountOwner').value=s.accountOwner||'';$('bankName').value=s.bankName||'';$('accountNumber').value=s.accountNumber||'';$('whatsapp').value=s.whatsapp||'737871631';let t=s.theme||{};$('themePrimary').value=t.primary||'#6d2747';$('themeBackground').value=t.background||'#fbf7f3';$('themeHeaderStart').value=t.headerStart||'#542039';$('themeHeaderEnd').value=t.headerEnd||'#8e4565';$('themeCard').value=t.card||'#ffffff';$('themeText').value=t.text||'#30242a';drawProducts();drawOrders()}
function drawProducts(){$('items').innerHTML='';if(!products.length){$('items').textContent='لا توجد منتجات';return}products.forEach(p=>{let row=document.createElement('div');row.className='row';let a=pics(p);if(a[0]){let im=document.createElement('img');im.src=a[0];row.append(im)}let info=document.createElement('div');info.className='info';let b=document.createElement('b');b.textContent=p.name;let s=document.createElement('div');s.className='hint';s.textContent=(p.price||'بدون سعر')+' · '+a.length+' صور';info.append(b,s);let edit=document.createElement('button');edit.className='secondary';edit.textContent='تعديل';edit.onclick=()=>editProduct(p);let del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=async()=>{if(confirm('حذف المنتج وصوره غير المستخدمة؟'))try{await api('deleteProduct',{id:p.id});await load()}catch(e){alert(e.message)}};row.append(info,edit,del);$('items').append(row)})}
function editProduct(p){$('editId').value=p.id;$('productName').value=p.name;$('productPrice').value=p.price||'';$('productImages').value='';$('preview').innerHTML='';pics(p).forEach(src=>{let im=document.createElement('img');im.src=src;$('preview').append(im)});$('productFormTitle').textContent='تعديل المنتج';$('saveProduct').textContent='حفظ التعديلات';$('cancelEdit').classList.remove('hidden');$('productForm').scrollIntoView({behavior:'smooth'})}
function resetProduct(){$('productForm').reset();$('editId').value='';$('preview').innerHTML='';$('productFormTitle').textContent='إضافة منتج';$('saveProduct').textContent='حفظ المنتج';$('cancelEdit').classList.add('hidden')}
function compress(f){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=no;r.onload=()=>{let im=new Image();im.onerror=no;im.onload=()=>{let k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.76,make=()=>{let v=c.toDataURL('image/jpeg',q);if(v.length>850000&&q>.4){q-=.08;return make()}ok(v)};make()};im.src=r.result};r.readAsDataURL(f)})}
$('productImages').onchange=()=>{let fs=[...$('productImages').files];$('preview').innerHTML='';if(fs.length>10){alert('الحد الأقصى 10 صور');$('productImages').value='';return}fs.forEach(f=>{let im=document.createElement('img');im.src=URL.createObjectURL(f);$('preview').append(im)})};
$('loginForm').onsubmit=async e=>{e.preventDefault();pass=$('password').value.trim();$('error').textContent='جارٍ التحقق...';try{await api('login');$('login').classList.add('hidden');$('workspace').classList.remove('hidden');await load();$('error').textContent=''}catch(x){$('error').textContent=x.message}};
$('nameForm').onsubmit=async e=>{e.preventDefault();try{await api('rename',{shopName:$('shopName').value.trim()});alert('تم حفظ اسم المحل')}catch(x){alert(x.message)}};
$('themeForm').onsubmit=async e=>{e.preventDefault();try{await api('saveTheme',{theme:{primary:$('themePrimary').value,background:$('themeBackground').value,headerStart:$('themeHeaderStart').value,headerEnd:$('themeHeaderEnd').value,card:$('themeCard').value,text:$('themeText').value}});alert('تم حفظ ألوان المتجر؛ حدّث الصفحة الرئيسية لرؤية التغيير')}catch(x){alert(x.message)}};
$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await api('saveSettings',{settings:{accountOwner:$('accountOwner').value.trim(),bankName:$('bankName').value.trim(),accountNumber:$('accountNumber').value.trim(),whatsapp:$('whatsapp').value.trim()}});alert('تم حفظ البيانات')}catch(x){alert(x.message)}};
$('productForm').onsubmit=async e=>{e.preventDefault();let fs=[...$('productImages').files];if(fs.length>10)return alert('الحد الأقصى 10 صور');$('saveProduct').disabled=true;try{let images=[];for(let i=0;i<fs.length;i++){$('productStatus').textContent='ضغط الصورة '+(i+1)+' من '+fs.length;images.push(await compress(fs[i]))}let extra={id:$('editId').value,name:$('productName').value.trim(),price:$('productPrice').value.trim()};if(fs.length)extra.images=images;let action=extra.id?'updateProduct':'addProduct';delete extra.id;if(action==='updateProduct')extra.id=$('editId').value;await api(action,extra);resetProduct();$('productStatus').textContent='تم الحفظ';await load()}catch(x){alert(x.message)}finally{$('saveProduct').disabled=false}};
$('cancelEdit').onclick=resetProduct;
function drawOrders(){$('orders').innerHTML='';$('orderCount').textContent=orders.length?'('+orders.length+')':'';if(!orders.length){$('orders').textContent='لا توجد طلبات حتى الآن';return}orders.forEach(o=>{let box=document.createElement('div');box.className='order';let head=document.createElement('div');head.className='orderhead';let title=document.createElement('b');title.textContent='طلب #'+o.id;let status=document.createElement('span');status.className='badge';status.textContent=o.status==='done'?'تم التنفيذ':o.status==='rejected'?'عدم القبول':'قيد المراجعة';head.append(title,status);box.append(head);let detail=document.createElement('p');detail.textContent=(o.items||[]).map(i=>i.name+' × '+i.qty+' ('+(i.price||'بدون سعر')+')').join('، ');box.append(detail);let phone=document.createElement('p');phone.textContent='واتساب العميل: '+o.buyerWhatsapp;box.append(phone);if(o.location){let loc=document.createElement('a');loc.href=o.location.startsWith('http')?o.location:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.location);loc.target='_blank';loc.textContent='عرض موقع العميل';box.append(loc)}if(o.receipt){let im=document.createElement('img');im.className='receipt';im.src=o.receipt;im.onclick=()=>window.open(o.receipt,'_blank');box.append(im)}let actions=document.createElement('div');actions.className='tabs';let done=document.createElement('button');done.className='primary';done.textContent='تم التنفيذ';done.onclick=()=>changeStatus(o.id,'done');let reject=document.createElement('button');reject.className='secondary';reject.textContent='عدم القبول';reject.onclick=()=>changeStatus(o.id,'rejected');let wa=document.createElement('button');wa.className='secondary';wa.textContent='واتساب العميل';wa.onclick=()=>{let n=String(o.buyerWhatsapp).replace(/\D/g,'');if(n.startsWith('0'))n='967'+n.slice(1);else if(n.length===9)n='967'+n;let msg='بخصوص طلبك رقم '+o.id+' من المتجر: '+(o.status==='done'?'تم تنفيذ الطلب':o.status==='rejected'?'نعتذر، لم يتم قبول الطلب':'طلبك قيد المراجعة');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')};let del=document.createElement('button');del.className='danger';del.textContent='حذف الطلب';del.onclick=async()=>{if(confirm('حذف هذا الطلب وصورة السند؟'))try{await api('deleteOrder',{id:o.id});await load()}catch(e){alert(e.message)}};actions.append(done,reject,wa,del);box.append(actions);$('orders').append(box)})}
async function changeStatus(id,status){try{await api('updateOrderStatus',{id,status});await load()}catch(e){alert(e.message)}}
$('tabProducts').onclick=()=>{$('productsView').classList.remove('hidden');$('ordersView').classList.add('hidden')};$('tabOrders').onclick=()=>{$('ordersView').classList.remove('hidden');$('productsView').classList.add('hidden')};
</script></body></html>
